name: Release

on:
  push:
    tags:
      - 'v*'
  # The next two events dry-run the workflow: they build and package every
  # archive under a placeholder tag, and neither creates a release nor publishes.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'install.sh'
      - 'scripts/test-install.sh'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dry-run' }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          # Linux x86_64 musl (static)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p engraver-cli

      - name: Generate shell completions
        shell: bash
        run: |
          mkdir -p completions
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ./target/${{ matrix.target }}/release/engraver.exe completions bash > completions/engraver.bash
            ./target/${{ matrix.target }}/release/engraver.exe completions zsh > completions/_engraver
            ./target/${{ matrix.target }}/release/engraver.exe completions fish > completions/engraver.fish
            ./target/${{ matrix.target }}/release/engraver.exe completions powershell > completions/_engraver.ps1
            ./target/${{ matrix.target }}/release/engraver.exe completions elvish > completions/engraver.elv
          else
            ./target/${{ matrix.target }}/release/engraver completions bash > completions/engraver.bash
            ./target/${{ matrix.target }}/release/engraver completions zsh > completions/_engraver
            ./target/${{ matrix.target }}/release/engraver completions fish > completions/engraver.fish
            ./target/${{ matrix.target }}/release/engraver completions powershell > completions/_engraver.ps1
            ./target/${{ matrix.target }}/release/engraver completions elvish > completions/engraver.elv
          fi

      - name: Generate man pages
        shell: bash
        run: |
          mkdir -p man
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ./target/${{ matrix.target }}/release/engraver.exe mangen --out-dir man
          else
            ./target/${{ matrix.target }}/release/engraver mangen --out-dir man
          fi

      - name: Create archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          ARCHIVE_NAME="engraver-${TAG}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE_NAME"
          cp target/${{ matrix.target }}/release/engraver "$ARCHIVE_NAME/"
          cp -r completions "$ARCHIVE_NAME/"
          cp -r man "$ARCHIVE_NAME/"
          cp README.md LICENSE "$ARCHIVE_NAME/" 2>/dev/null || true
          tar -czvf "$ARCHIVE_NAME.tar.gz" "$ARCHIVE_NAME"
          echo "ARCHIVE=$ARCHIVE_NAME.tar.gz" >> "$GITHUB_ENV"

      - name: Create archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ARCHIVE_NAME = "engraver-${env:TAG}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $ARCHIVE_NAME -Force
          Copy-Item "target/${{ matrix.target }}/release/engraver.exe" "$ARCHIVE_NAME/"
          Copy-Item -Recurse "completions" "$ARCHIVE_NAME/"
          Copy-Item -Recurse "man" "$ARCHIVE_NAME/"
          Copy-Item "README.md", "LICENSE" "$ARCHIVE_NAME/" -ErrorAction SilentlyContinue
          Compress-Archive -Path $ARCHIVE_NAME -DestinationPath "$ARCHIVE_NAME.zip"
          echo "ARCHIVE=$ARCHIVE_NAME.zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: engraver-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  check-crates:
    name: Check crates.io packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # cargo publish --dry-run doesn't apply the limits crates.io checks on
      # upload, so a crate can package here and still be refused at publish.
      - name: Check the metadata crates.io requires
        run: |
          problems=$(cargo metadata --no-deps --format-version 1 | jq -r '
            .packages[] | select(.publish == null) | . as $p |
            (if (.keywords | length) > 5 then "has \(.keywords | length) keywords, and crates.io allows at most 5" else empty end),
            (.keywords[] | select(test("^[A-Za-z0-9][A-Za-z0-9_+-]{0,19}$") | not) | "has the keyword \"\(.)\", which crates.io refuses"),
            (if (.description // "") == "" then "has no description" else empty end),
            (if (.license // "") == "" and (.license_file // "") == "" then "has no license" else empty end)
            | "\($p.name) \(.)"')
          if [[ -n "$problems" ]]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$problems"
            exit 1
          fi

      - name: Package every publishable crate
        run: cargo publish --workspace --dry-run

  package:
    name: Package release files
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: engraver-*
          merge-multiple: true
          path: dist

      - name: Generate SBOM
        run: |
          cargo install cargo-sbom --locked --version 0.10.0
          cargo sbom --output-format cyclone_dx_json_1_6 > dist/engraver-sbom.cdx.json

      - name: Create checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.zip *.cdx.json > checksums.txt
          cat checksums.txt

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/

  test-install:
    name: Test install.sh (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Install through install.sh
        run: scripts/test-install.sh dist

  release:
    name: Create Release
    needs: [package, test-install, check-crates]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for cosign keyless signing via OIDC

    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release files
        run: |
          # The glob expands before the loop, so the bundles are not signed in turn.
          for f in dist/*; do
            cosign sign-blob --yes "$f" --bundle "${f}.bundle"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    if: "!contains(github.ref_name, '-')"  # Skip for pre-releases

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Publish what crates.io does not have yet, so that rerunning the job
          # after a failure publishes the rest instead of failing on the crates
          # that are already up.
          packages=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.publish == null) | "\(.name) \(.version)"')
          publish=()
          while read -r name version; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A 'engraver-release (https://github.com/mstephenholl/engraver)' \
              "https://crates.io/api/v1/crates/${name}/${version}")
            case "$status" in
              200) echo "${name} ${version} is already on crates.io" ;;
              404) publish+=(-p "$name") ;;
              *)
                echo "::error::crates.io answered ${status} for ${name} ${version}"
                exit 1
                ;;
            esac
          done <<< "$packages"
          if [[ ${#publish[@]} -eq 0 ]]; then
            echo "Every crate is already on crates.io."
            exit 0
          fi
          cargo publish "${publish[@]}"
