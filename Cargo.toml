[workspace]
resolver = "3"
members = [
    "crates/engraver-core",
    "crates/engraver-cli",
    "crates/engraver-gui",
    "crates/engraver-platform",
    "crates/engraver-detect",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Engraver Contributors"]
license = "MIT"
repository = "https://github.com/mstephenholl/engraver"
keywords = ["usb", "bootable", "iso", "flash", "imaging"]
rust-version = "1.89"

[workspace.dependencies]
# Core functionality
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime. Only engraver-core uses it, and only for the multi-thread runtime.
tokio = { version = "1", features = ["rt-multi-thread"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.18"
console = "0.16"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# HTTP for remote sources
reqwest = { version = "0.13", features = ["stream", "rustls-no-provider"], default-features = false }

# Compression
flate2 = "1"
xz2 = "0.1"
zstd = "0.14"
bzip2 = "0.6"

# Checksums/Verification
sha2 = "0.11"
md-5 = "0.11"
crc32fast = "1"

# Cross-platform
cfg-if = "1"

# Testing
mockall = "0.15"
tempfile = "3"
assert_cmd = "2"
predicates = "3"

# Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }

# Pre-commit hooks
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.bench]
lto = true
codegen-units = 1
