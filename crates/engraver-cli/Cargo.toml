[package]
name = "engraver-cli"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
authors = ["Engraver Contributors"]
license = "MIT"
description = "A safe, fast tool for creating bootable USB drives, SD cards, and NVMe drives"
repository = "https://github.com/mstephenholl/engraver"
keywords = ["disk", "imaging", "iso", "usb", "flash", "bootable"]
categories = ["command-line-utilities", "filesystem"]
default-run = "engraver"

[[bin]]
name = "engraver"
path = "src/main.rs"

[dependencies]
# Workspace crates
engraver-core = { version = "0.1.0", path = "../engraver-core" }
engraver-detect = { version = "0.1.0", path = "../engraver-detect" }
engraver-platform = { version = "0.1.0", path = "../engraver-platform" }

# CLI framework
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.3"

# Progress bars and terminal UI
indicatif = "0.18"
console = "0.16"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
ctrlc = "3"
humansize = "2"
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
flate2 = { workspace = true }
xz2 = { workspace = true }
zstd = { workspace = true }
cargo-husky = { workspace = true }

# The prompt tests drive a prompt on a pseudo-terminal: a pty on Unix and a
# ConPTY on Windows.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[features]
default = ["partition-info"]
# Partition table inspection
partition-info = ["engraver-core/partition-info"]
# Cloud storage support (forwarded to engraver-core)
s3 = ["engraver-core/s3"]
gcs = ["engraver-core/gcs"]
azure = ["engraver-core/azure"]
cloud = ["s3", "gcs", "azure"]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
