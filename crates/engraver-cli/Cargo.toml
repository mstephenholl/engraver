[package]
name = "engraver-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "A safe, fast tool for creating bootable USB drives, SD cards, and NVMe drives"
repository.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "filesystem"]
default-run = "engraver"

[[bin]]
name = "engraver"
path = "src/main.rs"

[dependencies]
# Workspace crates
engraver-core = { version = "0.2.0", path = "../engraver-core" }
engraver-detect = { version = "0.2.0", path = "../engraver-detect" }
engraver-platform = { version = "0.2.0", path = "../engraver-platform" }

# CLI framework
clap = { workspace = true, features = ["wrap_help"] }
clap_complete = "4"
clap_mangen = "0.3"

# Progress bars and terminal UI
indicatif = { workspace = true }
console = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Misc
ctrlc = "3"
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
flate2 = { workspace = true }
xz2 = { workspace = true }
zstd = { workspace = true }
cargo-husky = { workspace = true }

# The prompt tests drive a prompt on a pseudo-terminal: a pty on Unix and a
# ConPTY on Windows.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[features]
default = ["partition-info"]
# Partition table inspection
partition-info = ["engraver-core/partition-info"]
# Cloud storage support (forwarded to engraver-core)
s3 = ["engraver-core/s3"]
gcs = ["engraver-core/gcs"]
azure = ["engraver-core/azure"]
cloud = ["s3", "gcs", "azure"]

[lints]
workspace = true
