[package]
name = "engraver-detect"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
authors = ["Engraver Contributors"]
license = "MIT"
description = "Safe drive detection and enumeration for Engraver"
repository = "https://github.com/mstephenholl/engraver"
keywords = ["usb", "drive", "detection", "disk"]
categories = ["hardware-support", "os"]

[dependencies]
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
cfg-if = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
mockall = "0.15"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
