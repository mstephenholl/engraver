[package]
name = "engraver-detect"
version = "0.1.1"
edition = "2021"
rust-version.workspace = true
authors = ["Engraver Contributors"]
license = "MIT"
description = "Safe drive detection and enumeration for Engraver"
repository = "https://github.com/mstephenholl/engraver"
keywords = ["usb", "drive", "detection", "disk"]
categories = ["hardware-support", "os"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
cfg-if = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
mockall = { workspace = true }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
