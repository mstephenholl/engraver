[package]
name = "engraver-platform"
version = "0.1.1"
edition = "2021"
rust-version.workspace = true
authors = ["Engraver Contributors"]
license = "MIT"
description = "Platform-specific raw device I/O for Engraver"
repository = "https://github.com/mstephenholl/engraver"
keywords = ["disk", "io", "raw", "device"]
categories = ["os", "filesystem"]

[features]
default = []
io_uring = ["dep:io-uring"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
cfg-if = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7.16", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_Security",
] }

[dev-dependencies]
tempfile = { workspace = true }

[[example]]
name = "uring_bench"
required-features = ["io_uring"]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
